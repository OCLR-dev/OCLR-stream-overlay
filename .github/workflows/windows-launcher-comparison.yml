name: Windows launcher comparison
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/windows-launcher/**'
      - 'tools/packaging/**'
      - '.github/workflows/windows-launcher-comparison.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          # Last direct Win32 launcher, including the sidebar focus fix.
          ref: d6f9df491fd26182fc67c8ab4e49523756f77fba
          path: win32-baseline
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build both Windows ZIPs on the same runner
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/packaging/build_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtime = (Resolve-Path 'release/node-v22.23.4-win-x64.zip').Path
          Set-Location -LiteralPath win32-baseline
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/packaging/build_windows.py --node-archive $runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test both extracted launchers with external traffic blocked
        shell: pwsh
        run: |
          $directories = @{}
          foreach ($case in @(
              @{ Name = 'win32'; Zip = 'win32-baseline/release/OCLR-Windows-x64.zip' },
              @{ Name = 'windigo'; Zip = 'release/OCLR-Windows-x64.zip' }
          )) {
            $zip = $case.Zip
            $expected = (Get-Content -LiteralPath "$zip.sha256").Split(' ')[0]
            if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne $expected) { throw "Checksum mismatch: $zip" }
            $destination = Join-Path $env:RUNNER_TEMP $case.Name
            New-Item -ItemType Directory -Path $destination | Out-Null
            Copy-Item -LiteralPath $zip -Destination $destination
            Expand-Archive -LiteralPath $zip -DestinationPath $destination
            $directories[$case.Name] = Join-Path $destination 'OCLR-Windows-x64'
          }
          tools/packaging/verify_launcher_offline.ps1 -Baseline $directories.win32 -Windigo $directories.windigo -Report 'release/windows-launcher-comparison.json'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: OCLR-Windigo-Windows-x64
          path: |
            release/OCLR-Windows-x64.zip
            release/OCLR-Windows-x64.zip.sha256
            release/windows-launcher-comparison.json
          if-no-files-found: error
