name: Windows portable validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - run: npm ci
      - run: python tools/packaging/build_windows.py
      - run: npm test
      - name: Test the actual portable EXE and bundled runtime
        shell: pwsh
        run: |
          & .\release\OCLR-Windows-x64\runtime\node.exe tools/packaging/verify_windows.mjs release/OCLR-Windows-x64 release/windows-native.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: OCLR-Windows-x64-validation
          path: |
            release/OCLR-Windows-x64.zip
            release/OCLR-Windows-x64.zip.sha256
            release/windows-native.json
          if-no-files-found: error
